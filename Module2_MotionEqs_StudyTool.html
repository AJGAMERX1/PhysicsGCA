<script>
// ========== CORE HELPERS ==========
function R(a,b,d){d=d||0;const f=Math.pow(10,d);return Math.round((Math.random()*(b-a)+a)*f)/f}
function rd(v,d){return Math.round(v*Math.pow(10,d))/Math.pow(10,d)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function fmtTime(s){const m=Math.floor(s/60),sec=s%60;return m+":"+(sec<10?"0":"")+sec}

// ========== VOCAB ==========
const VOCAB=[
{t:"kinematic equations",d:"the three equations derived in Module 2 (v = v₀ + at, v² = v₀² + 2aΔx, Δx = v₀t + ½at²) that describe one-dimensional motion under constant acceleration"},
{t:"v = v₀ + at",d:"Equation 2.6: relates final velocity, initial velocity, acceleration, and time; valid only when acceleration is constant"},
{t:"v² = v₀² + 2a·Δx",d:"Equation 2.15: relates final velocity, initial velocity, acceleration, and displacement; useful when time is not given or needed"},
{t:"Δx = v₀t + ½at²",d:"Equation 2.19: relates displacement, initial velocity, acceleration, and time; derived from the area under a velocity-time graph"},
{t:"constant acceleration condition",d:"the requirement that must be satisfied before using any of the three Module 2 equations; if acceleration varies, these equations do not apply"},
{t:"derivation",d:"a process that starts with known equations and uses algebra and reasoning to produce a brand-new equation; important for understanding where equations come from"},
{t:"free fall",d:"the motion of an object when it is falling solely under the influence of gravity, with no other forces (like air resistance) acting on it"},
{t:"acceleration due to gravity (g)",d:"the constant acceleration experienced by all objects in free fall near Earth's surface; g = 9.8 m/s² (or 32 ft/s²) directed straight down"},
{t:"air resistance",d:"the force on a falling object caused by collisions with gas molecules and atoms in the air; opposes the motion of a falling object"},
{t:"terminal velocity",d:"the maximum velocity a falling object subject to air resistance can achieve; reached when air resistance exactly cancels gravity, making net acceleration zero"},
{t:"v₀ (v-naught)",d:"the initial velocity of an object at the start of the motion (when t = 0); pronounced 'v-naught'"},
{t:"deceleration",d:"informal term for negative acceleration; when an object is slowing down, its acceleration and velocity have opposite signs"},
{t:"stopping distance",d:"the displacement an object travels from the moment brakes are applied until it reaches zero velocity; calculated using v² = v₀² + 2aΔx with v = 0"},
{t:"reaction time",d:"the time it takes a person to notice a situation and react; can be measured experimentally using free fall distance (Experiment 2.2 in the textbook)"},
{t:"maximum height (projectile)",d:"the highest point reached by an object thrown upward; at this point the object's velocity is zero (though acceleration is still −9.8 m/s²)"},
{t:"independence of g",d:"the fact that the acceleration due to gravity is the same for all objects regardless of their mass, shape, or composition (as long as air resistance is negligible)"}
];
// ========== RANDOMIZATION POOLS ==========
const SUBS_VEH=[{n:"A car"},{n:"A truck"},{n:"A motorcycle"},{n:"A bus"},{n:"A sports car"},{n:"A van"}];
const SUBS_ATH=[{n:"A sprinter"},{n:"A cyclist"},{n:"A skater"},{n:"A dragster"},{n:"A rocket sled"}];
const SUBS_FF=[{n:"A penny"},{n:"A rock"},{n:"A coin"},{n:"A ball"},{n:"A marble"},{n:"A bolt"}];
const DIRS=["east","north","forward","down the track"];
const NICE_A=[0.5,1.0,1.5,2.0,2.5,3.0,4.0,5.0,6.0,8.0];
const NICE_V=[5,8,10,12,15,18,20,24,25,30,35,40];
const NICE_T=[2,3,4,5,6,8,10,12,15,20,25,30];

// ========== QUESTION GENERATORS ==========
const G={
// ============================================================
// 🔵 EQ 2.6 — v = v₀ + at (find any of the 4 variables)
// ============================================================
eq1_find_v(){
  const v0=pick(NICE_V),a=pick(NICE_A),t=pick(NICE_T);
  const v=v0+a*t;
  const sub=pick([...SUBS_VEH,...SUBS_ATH]);
  const dir=pick(DIRS);
  return{ref:"Eq 2.6",q:`${sub.n} is moving at <b>${v0} m/s ${dir}</b> and accelerates at <b>${a} m/s²</b> for <b>${t} seconds</b>. What is the final velocity?`,gv:`v₀ = ${v0} m/s\na = ${a} m/s²\nt = ${t} s`,fm:`v = v₀ + at`,fi:`v = ? m/s`,u:"m/s",a:v,tol:Math.max(v*0.02,0.1),
  st:[`<span class='lb'>FORMULA</span> v = v₀ + at`,`<span class='lb'>SUBSTITUTE</span> v = ${v0} + (${a})(${t})`,`<span class='lb'>SOLVE</span> v = ${v0} + ${a*t} = ${v} m/s`,`<span class='lb'>ANSWER</span> <span class='ans'>${v} m/s ${dir}</span>`],nt:`Eq 2.6 directly gives final velocity when you know starting velocity, acceleration, and time.`}
},
eq1_find_v0(){
  const v=pick(NICE_V),a=pick(NICE_A),t=pick(NICE_T);
  const v0=v-a*t;
  if(v0<0)return G.eq1_find_v0();
  const sub=pick(SUBS_VEH);
  return{ref:"Ex 2.1",q:`${sub.n} decelerates at <b>${a} m/s²</b> and comes to rest in <b>${t} seconds</b>. How fast was it going initially?`,gv:`v = 0 m/s (stopped)\na = −${a} m/s²\nt = ${t} s`,fm:`v = v₀ + at\nv₀ = v − at`,fi:`v₀ = ? m/s`,u:"m/s",a:a*t,tol:Math.max(a*t*0.02,0.1),
  st:[`<span class='lb'>REARRANGE</span> v₀ = v − at`,`<span class='lb'>SUBSTITUTE</span> v₀ = 0 − (−${a})(${t})`,`<span class='lb'>SOLVE</span> v₀ = ${a*t} m/s`,`<span class='lb'>ANSWER</span> <span class='ans'>${a*t} m/s</span>`],nt:`Textbook Example 2.1: "deceleration" means a is negative (opposite to motion). So v₀ = 0 − (−a)t = at.`}
},
eq1_find_t(){
  const v0=pick([15,18,20,22,23,25,28,30]);
  const v=v0+pick([5,8,10,12,15,20,25]);
  const a=pick([1.5,2.0,2.5,3.0,4.0,5.0]);
  const t=rd((v-v0)/a,1);
  return{ref:"OYO 2.1",q:`A police car is moving at <b>${v0} m/s</b> and needs to speed up to <b>${v} m/s</b> to match a speeder. If it can accelerate at <b>${a} m/s²</b>, how long does that take?`,gv:`v₀ = ${v0} m/s\nv = ${v} m/s\na = ${a} m/s²`,fm:`v = v₀ + at\nt = (v − v₀)/a`,fi:`t = ? s`,u:"s",a:t,tol:Math.max(t*0.025,0.1),
  st:[`<span class='lb'>REARRANGE</span> t = (v − v₀) / a`,`<span class='lb'>SUBSTITUTE</span> t = (${v} − ${v0}) / ${a}`,`<span class='lb'>SOLVE</span> t = ${rd(v-v0,1)} / ${a} = ${t} s`,`<span class='lb'>ANSWER</span> <span class='ans'>${t} s</span>`],nt:`Classic OYO 2.1 scenario. Police car needs to match the speeder's speed — solving for time to do so.`}
},
eq1_find_a(){
  const v0=pick([0,5,8,10,12,15]);
  const v=v0+pick([10,12,15,18,20,24,27,30]);
  const t=pick(NICE_T);
  const a=rd((v-v0)/t,2);
  const sub=pick([...SUBS_VEH,...SUBS_ATH]);
  return{ref:"Eq 2.6",q:`${sub.n} goes from <b>${v0} m/s</b> to <b>${v} m/s</b> in <b>${t} seconds</b>. What is the acceleration?`,gv:`v₀ = ${v0} m/s\nv = ${v} m/s\nt = ${t} s`,fm:`a = (v − v₀) / t`,fi:`a = ? m/s²`,u:"m/s²",a:a,tol:Math.max(Math.abs(a)*0.025,0.05),
  st:[`<span class='lb'>REARRANGE</span> a = (v − v₀) / t`,`<span class='lb'>SUBSTITUTE</span> a = (${v} − ${v0}) / ${t}`,`<span class='lb'>SOLVE</span> a = ${rd(v-v0,0)} / ${t} = ${a} m/s²`,`<span class='lb'>ANSWER</span> <span class='ans'>${a} m/s²</span>`],nt:`Rearranging v = v₀ + at for acceleration gives a = Δv/t — same as the original a = Δv/Δt definition.`}
},
eq1_from_rest(){
  const a=pick(NICE_A),t=pick(NICE_T);
  const v=a*t;
  const sub=pick([...SUBS_VEH,...SUBS_ATH]);
  return{ref:"Eq 2.6",q:`${sub.n} starts from rest and accelerates at <b>${a} m/s²</b> for <b>${t} seconds</b>. What is its final speed?`,gv:`v₀ = 0 m/s (starts from rest)\na = ${a} m/s²\nt = ${t} s`,fm:`v = v₀ + at`,fi:`v = ? m/s`,u:"m/s",a:v,tol:Math.max(v*0.02,0.1),
  st:[`<span class='lb'>FROM REST</span> v₀ = 0`,`<span class='lb'>SIMPLIFIES TO</span> v = at = ${a} × ${t}`,`<span class='lb'>ANSWER</span> <span class='ans'>${v} m/s</span>`],nt:`"Starts from rest" always means v₀ = 0. Equation simplifies to v = at.`}
},
eq1_brake_time(){
  const v0=pick([15,18,20,22,25,28,30,32,35]);
  const a=pick([2,2.5,3,4,5,6]);
  const t=rd(v0/a,1);
  const sub=pick(SUBS_VEH);
  return{ref:"Ex 2.1 style",q:`${sub.n} is traveling at <b>${v0} m/s</b> when the driver applies the brakes, decelerating the vehicle at <b>${a} m/s²</b>. How long does it take to stop completely?`,gv:`v₀ = ${v0} m/s\nv = 0 (stop)\na = −${a} m/s²`,fm:`v = v₀ + at\nt = −v₀/a`,fi:`t = ? s`,u:"s",a:t,tol:Math.max(t*0.025,0.1),
  st:[`<span class='lb'>SET v = 0</span> 0 = ${v0} + (−${a})t`,`<span class='lb'>REARRANGE</span> t = ${v0} / ${a}`,`<span class='lb'>ANSWER</span> <span class='ans'>${t} s</span>`],nt:`Deceleration means negative acceleration. Dividing a positive by a positive gives a positive time — always a good sign check.`}
},
eq1_match_velocity(){
  const v0=pick([10,12,15,18,20]);
  const vt=v0+pick([8,10,12,15,20]);
  const a=pick([2.0,2.5,3.0,4.0,5.0]);
  const t=rd((vt-v0)/a,1);
  return{ref:"OYO 2.1",q:`A car is moving at <b>${v0} m/s</b>. It needs to reach a speed of <b>${vt} m/s</b>. If its maximum acceleration is <b>${a} m/s²</b>, how long will it take?`,gv:`v₀ = ${v0} m/s\nv = ${vt} m/s\na = ${a} m/s²`,fm:`t = (v − v₀) / a`,fi:`t = ? s`,u:"s",a:t,tol:Math.max(t*0.025,0.1),
  st:[`<span class='lb'>REARRANGE</span> t = (v − v₀) / a`,`<span class='lb'>SOLVE</span> t = (${vt} − ${v0}) / ${a} = ${rd(vt-v0,0)} / ${a} = ${t} s`,`<span class='lb'>ANSWER</span> <span class='ans'>${t} s</span>`],nt:`Identical structure to OYO 2.1. Just need to identify which of the four variables is unknown.`}
},
eq1_find_a_brake(){
  const v0=pick([15,20,22,25,27,30]);
  const t=pick([3,4,5,6,8,10]);
  const a=rd(-v0/t,1);
  const sub=pick(SUBS_VEH);
  return{ref:"Eq 2.6 / braking",q:`${sub.n} traveling at <b>${v0} m/s</b> comes to a complete stop in <b>${t} seconds</b>. What was the deceleration?`,gv:`v₀ = ${v0} m/s\nv = 0\nt = ${t} s`,fm:`a = (v − v₀) / t`,fi:`a = ? m/s²`,u:"m/s²",a:a,tol:Math.max(Math.abs(a)*0.025,0.05),
  st:[`<span class='lb'>REARRANGE</span> a = (v − v₀) / t`,`<span class='lb'>SUBSTITUTE</span> a = (0 − ${v0}) / ${t}`,`<span class='lb'>SOLVE</span> a = ${-v0} / ${t} = ${a} m/s²`,`<span class='lb'>ANSWER</span> <span class='ans'>${a} m/s² (negative = braking)</span>`],nt:`Negative acceleration is not "wrong" — it tells you the car is slowing in the positive direction.`}
},

// ============================================================
// 🟢 EQ 2.15 — v² = v₀² + 2a·Δx
// ============================================================
eq2_find_dx_brake(){
  const v0=pick([15,18,20,22,24,25,27,30]);
  const a=pick([2.0,2.1,2.5,3.0,4.0,5.0,7.5]);
  const dx=rd(v0*v0/(2*a),0);
  const sub=pick(SUBS_VEH);
  return{ref:"Ex 2.2 / stopping distance",q:`${sub.n} is moving at <b>${v0} m/s</b> when the brakes apply a deceleration of <b>${a} m/s²</b>. What is the <b>stopping distance</b>?`,gv:`v₀ = ${v0} m/s\nv = 0 m/s\na = −${a} m/s²`,fm:`v² = v₀² + 2a·Δx\nΔx = −v₀²/(2a)`,fi:`Δx = ? m`,u:"m",a:dx,tol:Math.max(dx*0.025,0.5),
  st:[`<span class='lb'>SET v = 0</span> 0 = ${v0}² + 2(−${a})Δx`,`<span class='lb'>REARRANGE</span> Δx = −${v0*v0} / (−${2*a})`,`<span class='lb'>SOLVE</span> Δx = ${v0*v0} / ${2*a} = ${dx} m`,`<span class='lb'>ANSWER</span> <span class='ans'>${dx} m</span>`],nt:`Example 2.2 pattern — "stopping distance" problems always have v = 0 as the final condition.`}
},
eq2_find_v_from_rest(){
  const a=pick(NICE_A),dx=pick([10,15,20,25,30,40,50,60,80,100]);
  const v=rd(Math.sqrt(2*a*dx),1);
  const sub=pick([...SUBS_ATH,...SUBS_VEH]);
  return{ref:"Ex 2.2b / sprinter",q:`${sub.n} starts from rest and accelerates at <b>${a} m/s²</b> over a distance of <b>${dx} m</b>. What is the final velocity?`,gv:`v₀ = 0 m/s\na = ${a} m/s²\nΔx = ${dx} m`,fm:`v² = v₀² + 2a·Δx\nv = √(2a·Δx)`,fi:`v = ? m/s`,u:"m/s",a:v,tol:Math.max(v*0.025,0.1),
  st:[`<span class='lb'>v₀ = 0</span> v² = 2a·Δx`,`<span class='lb'>SUBSTITUTE</span> v² = 2(${a})(${dx}) = ${2*a*dx}`,`<span class='lb'>SQRT</span> v = √${2*a*dx} = ${v} m/s`,`<span class='lb'>ANSWER</span> <span class='ans'>${v} m/s</span>`],nt:`From rest: v₀² drops out, leaving v = √(2aΔx). Same pattern as Example 2.2 (sprinter radar).`}
},
eq2_find_a(){
  const v0=pick([0,5,8,10,12]);
  const v=pick([15,18,20,22,24,26,28,30]);
  const dx=pick([10,15,20,25,30,40,50]);
  const a=rd((v*v-v0*v0)/(2*dx),2);
  const sub=pick([...SUBS_ATH,...SUBS_VEH]);
  return{ref:"Ex 2.2b / find acceleration",q:`${sub.n} accelerates from <b>${v0} m/s</b> to <b>${v} m/s</b> over <b>${dx} m</b>. What was the acceleration?`,gv:`v₀ = ${v0} m/s\nv = ${v} m/s\nΔx = ${dx} m`,fm:`a = (v² − v₀²) / (2Δx)`,fi:`a = ? m/s²`,u:"m/s²",a:a,tol:Math.max(Math.abs(a)*0.025,0.05),
  st:[`<span class='lb'>REARRANGE</span> a = (v² − v₀²) / (2Δx)`,`<span class='lb'>SUBSTITUTE</span> a = (${v*v} − ${v0*v0}) / (2×${dx})`,`<span class='lb'>SOLVE</span> a = ${v*v-v0*v0} / ${2*dx} = ${a} m/s²`,`<span class='lb'>ANSWER</span> <span class='ans'>${a} m/s²</span>`],nt:`Rearranging for a: isolate it by subtracting v₀² and dividing by 2Δx. Note we never need time here!`}
},
eq2_find_v0(){
  const v=pick([10,12,15,18,20,24,25]);
  const a=pick([1.5,2.0,2.5,3.0,4.0]);
  const dx=pick([20,30,40,50,60,80,100]);
  const v0sq=v*v-2*a*dx;
  if(v0sq<0)return G.eq2_find_v0();
  const v0=rd(Math.sqrt(v0sq),1);
  const sub=pick(SUBS_VEH);
  return{ref:"Eq 2.15 / find v₀",q:`${sub.n} accelerates at <b>${a} m/s²</b> over <b>${dx} m</b> and reaches <b>${v} m/s</b>. What was its initial speed?`,gv:`v = ${v} m/s\na = ${a} m/s²\nΔx = ${dx} m`,fm:`v₀ = √(v² − 2a·Δx)`,fi:`v₀ = ? m/s`,u:"m/s",a:v0,tol:Math.max(v0*0.025,0.1),
  st:[`<span class='lb'>REARRANGE</span> v₀² = v² − 2a·Δx`,`<span class='lb'>SUBSTITUTE</span> v₀² = ${v*v} − 2(${a})(${dx}) = ${v0sq}`,`<span class='lb'>SQRT</span> v₀ = √${v0sq} = ${v0} m/s`,`<span class='lb'>ANSWER</span> <span class='ans'>${v0} m/s</span>`],nt:`Time doesn't appear in Eq 2.15 — perfect when you know velocity, acceleration, and displacement.`}
},
eq2_will_stop(){
  // Scenario: car + cat / obstacle at known distance — will it stop in time?
  const v0=pick([20,22,24,25,27,28,30]);
  const a=pick([5,6,7,7.5,8,10]);
  const dx_stop=rd(v0*v0/(2*a),0);
  const margin=pick([-5,-3,-2,2,3,5,8]);
  const dist=dx_stop+margin;
  const ask=pick(["dist","willit"]);
  if(ask==="dist"){
    return{ref:"Ex 2.4 / stopping distance",q:`A driver traveling at <b>${v0} m/s</b> hits the brakes hard (deceleration = <b>${a} m/s²</b>). How far does the car travel before stopping?`,gv:`v₀ = ${v0} m/s\nv = 0\na = −${a} m/s²`,fm:`Δx = v₀²/(2a)`,fi:`Δx = ? m`,u:"m",a:dx_stop,tol:Math.max(dx_stop*0.025,0.5),
    st:[`<span class='lb'>SET v = 0</span> 0 = ${v0}² + 2(−${a})Δx`,`<span class='lb'>SOLVE</span> Δx = ${v0*v0}/(${2*a}) = ${dx_stop} m`,`<span class='lb'>ANSWER</span> <span class='ans'>${dx_stop} m</span>`],nt:`Example 2.4 style: stopping distance = v₀²/(2|a|) when starting at v₀ and ending at rest.`}
  }
  return{ref:"Ex 2.4 style",q:`A car moving at <b>${v0} m/s</b> brakes at <b>${a} m/s²</b>. An obstacle is <b>${dist} m</b> away. Does the car stop in time? Enter the stopping distance in meters.`,gv:`v₀ = ${v0} m/s\nv = 0\na = −${a} m/s²\nObstacle: ${dist} m away`,fm:`Δx = v₀²/(2a)`,fi:`Stopping distance = ? m`,u:"m",a:dx_stop,tol:Math.max(dx_stop*0.025,0.5),
  st:[`<span class='lb'>STOPPING DISTANCE</span> Δx = ${v0*v0}/(${2*a}) = ${dx_stop} m`,`<span class='lb'>COMPARE</span> ${dx_stop} m vs ${dist} m obstacle`,`<span class='lb'>ANSWER</span> <span class='ans'>${dx_stop} m (car ${dx_stop<=dist?"stops safely ✓":"does NOT stop in time ✗"})</span>`],nt:`Stopping distance determines safety. Here ${dx_stop} ≤ ${dist}? ${dx_stop<=dist?"Yes — safe.":"No — collision."}`}
},
eq2_runway_length(){
  const v=pick([40,50,60,80,100]);
  const a=pick([2.0,2.5,3.0,4.0,5.0]);
  const dx=rd(v*v/(2*a),0);
  return{ref:"OYO 2.5 style",q:`A plane needs to reach <b>${v} m/s</b> before leaving the runway. If it accelerates from rest at <b>${a} m/s²</b>, what is the <b>minimum runway length</b>?`,gv:`v₀ = 0 m/s\nv = ${v} m/s\na = ${a} m/s²`,fm:`v² = v₀² + 2a·Δx\nΔx = v²/(2a)`,fi:`Δx = ? m`,u:"m",a:dx,tol:Math.max(dx*0.025,1),
  st:[`<span class='lb'>v₀ = 0</span> v² = 2a·Δx`,`<span class='lb'>REARRANGE</span> Δx = v²/(2a)`,`<span class='lb'>SOLVE</span> Δx = ${v*v}/(${2*a}) = ${dx} m`,`<span class='lb'>ANSWER</span> <span class='ans'>${dx} m</span>`],nt:`Minimum runway = stopping distance in reverse. OYO 2.5 uses this logic for takeoff planning.`}
},
eq2_nonzero_v0(){
  const v0=pick([5,8,10]),a=pick([2,3,4,5]),dx=pick([20,30,40,50,60]);
  const v=rd(Math.sqrt(v0*v0+2*a*dx),1);
  const sub=pick(SUBS_ATH);
  return{ref:"Eq 2.15",q:`${sub.n} is already moving at <b>${v0} m/s</b> and accelerates at <b>${a} m/s²</b> for <b>${dx} m</b>. What is the final velocity?`,gv:`v₀ = ${v0} m/s\na = ${a} m/s²\nΔx = ${dx} m`,fm:`v² = v₀² + 2a·Δx`,fi:`v = ? m/s`,u:"m/s",a:v,tol:Math.max(v*0.025,0.1),
  st:[`<span class='lb'>SUBSTITUTE</span> v² = ${v0}² + 2(${a})(${dx}) = ${v0*v0} + ${2*a*dx} = ${v0*v0+2*a*dx}`,`<span class='lb'>SQRT</span> v = √${v0*v0+2*a*dx} = ${v} m/s`,`<span class='lb'>ANSWER</span> <span class='ans'>${v} m/s</span>`],nt:`Non-zero v₀: need to square it before adding. A common mistake is forgetting to square v₀.`}
},

// ============================================================
// 🟡 EQ 2.19 — Δx = v₀t + ½at²
// ============================================================
eq3_find_dx_rest(){
  const a=pick([1.0,1.5,2.0,2.3,2.5,3.0,4.0]);
  const t=pick([5,8,10,12,15,20,25,28]);
  const dx=rd(0.5*a*t*t,0);
  const sub=pick([...SUBS_VEH,{n:"A plane"},{n:"A rocket"}]);
  return{ref:"Ex 2.3",q:`${sub.n} starts from rest and accelerates at <b>${a} m/s²</b> for <b>${t} seconds</b>. How far does it travel?`,gv:`v₀ = 0 m/s\na = ${a} m/s²\nt = ${t} s`,fm:`Δx = v₀t + ½at²`,fi:`Δx = ? m`,u:"m",a:dx,tol:Math.max(dx*0.02,1),

{title:"Acceleration Due to Gravity",fm:"g = 9.8 m/s²  (or 32 ft/s²)\na = −g = −9.8 m/s² (downward, if up = +)",vr:"<b>Same for all objects regardless of mass</b>",ex:"Drop from 50 m: v² = 2(9.8)(50) = 980 → v = 31.3 m/s"},
{title:"At Maximum Height (thrown up)",fm:"v = 0  (momentarily stopped)\na = −9.8 m/s² (still acting!)",vr:"Key: v = 0 ≠ a = 0. Object stops for one instant but gravity never pauses.",ex:"v₀=20 → h = 20²/19.6 = 20.4 m peak"},
{title:"Symmetry: Return to Same Height",fm:"|v_return| = |v₀|\nDirection reversed: v = −v₀",vr:"When Δx = 0: v² = v₀². Speed matches, direction flips.",ex:"Thrown at +5 m/s, caught at same h → v = −5 m/s"}
]},
{section:"Terminal Velocity",items:[
{title:"Terminal Velocity Definition",fm:"Terminal velocity = max speed in free fall with air resistance\nReached when: air resistance force = gravity",vr:"At terminal velocity: a = 0, velocity is constant",ex:"Skydiver with arms spread: ~120 mph; with arms in: ~200 mph"},
{title:"Factors That Affect Terminal Velocity",fm:"Higher terminal v → less air resistance\nLower terminal v → more air resistance",vr:"Three factors: <b>weight</b> (↑ weight → ↑ terminal v), <b>shape</b> (compact → ↑ terminal v), <b>orientation</b> (streamlined → ↑ terminal v)",ex:"Wadded paper > folded paper > flat paper (terminal velocities)"}
]},
{section:"Equation Selection Guide",items:[
{title:"Which Equation to Use",fm:"v₀, a, t → find v:     v = v₀ + at\nv₀, v, a → find Δx:   v² = v₀² + 2aΔx\nv₀, a, t → find Δx:   Δx = v₀t + ½at²\nv₀, v, t → find a:    rearrange 2.6",vr:"List your knowns. Find the equation that has only ONE unknown.",ex:"Know v₀, v, Δx (no t): use Eq 2.15!"}
]}
];

let stats={c:0,a:0,streak:0,best:0};

function renderStats(){
  document.getElementById("sC").textContent=stats.c;

function recordAnswer(ok){
  stats.a++;

  else stats.streak=0;

}

function switchMode(m){

function renderCtrls(){
  const el=document.getElementById("ctrlBar");
  if(mode==="problems"){
    let h=SEC.map(s=>`<button class="cb${active===s.id?" on":""}" onclick="active='${s.id}';subType=null;genP()">${s.icon} ${s.title}</button>`).join("");
    h+=`<span style="width:6px;display:inline-block"></span><span class="cl">Hide:</span>`;
    h+=`<button class="tg" id="tg-given" onclick="tglH('given')"><span class="tg-dot"></span>Givens</button>`;
    h+=`<button class="tg" id="tg-formula" onclick="tglH('formula')"><span class="tg-dot"></span>Formulas</button>`;
    h+=`<button class="tg" id="tg-find" onclick="tglH('find')"><span class="tg-dot"></span>Solve-For</button>`;
    h+=`<button class="tg" id="tg-all" onclick="tglAll()"><span class="tg-dot"></span>Hard Mode</button>`;
    el.innerHTML=h;el.style.display="flex";syncToggles();
  } else if(mode==="vocab"){
    el.style.display="flex";
    el.innerHTML=`<span class="cl">Format:</span>`+
    `<button class="cb${vMode==="mc"?" on":""}" onclick="vMode='mc';genV()">Multiple Choice</button>`+
    `<button class="cb${vMode==="written"?" on":""}" onclick="vMode='written';genV()">Written</button>`+
    `<button class="cb${vMode==="tf"?" on":""}" onclick="vMode='tf';genV()">True / False</button>`;
  } else if(mode==="learn"){
    el.style.display="flex";
    el.innerHTML=Object.keys(LESSONS).map(k=>`<button class="cb${lessonKey===k?" on":""}" onclick="openLesson('${k}')">${LESSONS[k].icon} ${LESSONS[k].title}</button>`).join("");
  } else if(mode==="cheat"){
    el.style.display="flex";
    el.innerHTML=`<span class="cl">All formulas, definitions, and key facts for Module 1</span>`;
  } else {
    el.style.display="none";el.innerHTML="";
  }
}
function tglH(k){hide[k]=!hide[k];syncToggles();if(prob)renderProb()}
function tglAll(){const all=hide.given&&hide.formula&&hide.find;hide.given=hide.formula=hide.find=!all;syncToggles();if(prob)renderProb()}
function syncToggles(){
  ["given","formula","find"].forEach(k=>{const b=document.getElementById("tg-"+k);if(b)b.classList.toggle("on",hide[k])});
  const a=document.getElementById("tg-all");if(a)a.classList.toggle("on",hide.given&&hide.formula&&hide.find);
}

// ============================================================
// PROBLEMS MODE
// ============================================================
function genP(){
  renderCtrls();
  const sec=SEC.find(s=>s.id===active);
  let genId;
  if(subType)genId=subType;
  else genId=pick(sec.types).id;
  prob=G[genId]();
  prob._gen=genId;
  userVal="";answered=false;solShown=false;
  renderProb();
}
function chkP(){
  const i=document.getElementById("inp");if(!i)return;
  userVal=i.value.trim();
  if(userVal==="")return;
  answered=true;
  const ok=isCorrect(prob,userVal);
  recordAnswer(ok);
  renderProb();
}
function isCorrect(p,val){
  if(p.isText){
    const norm=s=>String(s).toLowerCase().replace(/\s+/g,"").replace(/[²³]/g,c=>({"²":"2","³":"3"}[c]));
    return norm(val)===norm(p.a);
  }
  const v=parseFloat(String(val).replace(/[+,\s]/g,""));
  return !isNaN(v)&&Math.abs(v-p.a)<=p.tol;
}
function showPS(){solShown=true;renderProb()}
function renderProb(){
  const el=document.getElementById("main"),p=prob;
  if(!p){el.innerHTML="";return}
  const ok=answered&&isCorrect(p,userVal);
  const cc=answered?(ok?"ok":"no"):"";
  const bc=answered?(ok?"bg-ok":"bg-no"):"bg-q";
  const sec=SEC.find(s=>s.id===active);
  const hc=(hide.given?1:0)+(hide.formula?1:0)+(hide.find?1:0);
  const dl=hc===3?"HARD MODE":hc===2?"HARD+":hc===1?"HARD":"";
  let h=`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px">`;
  h+=`<button class="cb${!subType?" on":""}" onclick="subType=null;genP()">🎲 Random</button>`;
  sec.types.forEach(t=>{h+=`<button class="cb${subType===t.id?" on":""}" onclick="subType='${t.id}';genP()">${t.name}</button>`});
  h+=`</div>`;
  h+=`<div class="pc ${cc}"><div class="pc-top"><span class="bg ${bc}">${answered?(ok?"✓ Correct":"✗ Incorrect"):"Problem"}</span><span class="bg bg-ty">${p.ref}</span>${dl?`<span class="bg bg-hard">${dl}</span>`:""}</div>`;
  h+=`<div class="q-txt">${p.q}</div>`;
  const gH=hide.given&&!answered&&!solShown,fH=hide.formula&&!answered&&!solShown,wH=hide.find&&!answered&&!solShown;
  if(p.gv&&(!gH||!fH||!wH)){
    h+=`<div class="ir">`;
    if(!gH)h+=`<div class="ib ib-g"><span class="ib-l">Given</span>${p.gv.replace(/\n/g,"<br>")}</div>`;
    if(p.fm&&!fH)h+=`<div class="ib ib-f"><span class="ib-l">Formula</span>${p.fm.replace(/\n/g,"<br>")}</div>`;
    if(p.fi&&!wH)h+=`<div class="ib ib-w"><span class="ib-l">Solve For</span>${p.fi.replace(/\n/g,"<br>")}</div>`;
    h+=`</div>`;
  }
  if(!answered){
    h+=`<div class="aa"><div class="aw"><input class="ai" id="inp" type="text" inputmode="${p.isText?"text":"decimal"}" placeholder="Type your answer…" value="${userVal}" onkeydown="if(event.key==='Enter')chkP()"><span class="au">${p.u||""}</span></div><button class="ab" onclick="chkP()">Check</button></div>`;
    h+=`<div class="btn-row"><button class="btn-sh" onclick="showPS()">Show Solution</button><button class="btn-sh" onclick="genP()">Skip →</button></div>`;
  } else {
    h+=`<div class="aa"><div class="aw"><input class="ai ${ok?"v-ok":"v-no"}" value="${userVal}" disabled><span class="au">${p.u||""}</span></div></div>`;
    h+=`<div class="fb ${ok?"fb-ok":"fb-no"}">${ok?`✓ Correct! Streak: ${stats.streak} 🔥`:"✗ Not quite"}</div>`;
    if(!ok)h+=`<div class="fb-v">Correct answer: ${p.a} ${p.u||""}</div>`;
  }
  if(answered||solShown){
    h+=`<div class="sol"><div class="sol-tag">Solution</div>`;
    p.st.forEach(s=>{h+=`<div class="stp">${s}</div>`});
    h+=`<div class="sol-note">${p.nt}</div></div>`;
  }
  if(answered)h+=`<div class="btn-row" style="margin-top:10px"><button class="btn-nx" onclick="genP()">Next Problem →</button></div>`;
  h+=`</div>`;
  el.innerHTML=h;
  if(!answered){const i=document.getElementById("inp");if(i)setTimeout(()=>i.focus(),50)}
}

// ============================================================
// VOCAB MODE
// ============================================================
function genV(){
  renderCtrls();
  const term=pick(VOCAB);
  vAns="";vAnswered=false;
  if(vMode==="mc"){
    const others=shuffle(VOCAB.filter(v=>v.t!==term.t)).slice(0,3);
    const opts=shuffle([{t:term.d,c:true},...others.map(o=>({t:o.d,c:false}))]);
    vQ={mode:"mc",term,opts,ci:opts.findIndex(o=>o.c)};
  } else if(vMode==="tf"){
    const isTrue=Math.random()<0.5;
    const shown=isTrue?term.d:pick(VOCAB.filter(v=>v.t!==term.t)).d;
    vQ={mode:"tf",term,shown,correct:isTrue};
  } else {
    vQ={mode:"written",term};
  }
  renderVocab();
}
function chkVMC(i){
  if(vAnswered)return;
  vAnswered=true;vAns=i;
  recordAnswer(i===vQ.ci);
  renderVocab();
}
function chkVTF(ans){
  if(vAnswered)return;
  vAnswered=true;vAns=ans;
  recordAnswer(ans===vQ.correct);
  renderVocab();
}
function chkVW(){
  const ta=document.getElementById("vta");if(!ta)return;
  vAns=ta.value.trim();
  if(vAns==="")return;
  vAnswered=true;
  renderVocab();
}
function renderVocab(){
  const el=document.getElementById("main");
  if(!vQ){el.innerHTML="";return}
  let h="";
  if(vQ.mode==="mc"){
    const ok=vAnswered&&vAns===vQ.ci;
    h+=`<div class="pc ${vAnswered?(ok?"ok":"no"):""}"><div class="pc-top"><span class="bg ${vAnswered?(ok?"bg-ok":"bg-no"):"bg-q"}">${vAnswered?(ok?"✓ Correct":"✗ Incorrect"):"Vocabulary"}</span><span class="bg bg-ty">Definition Match</span></div>`;
    h+=`<div class="q-txt">Which definition matches <b>"${vQ.term.t}"</b>?</div><div class="opts">`;
    vQ.opts.forEach((o,i)=>{
      let cls="opt";
      if(vAnswered){cls+=" done";if(i===vQ.ci)cls+=" c-ok";else if(i===vAns)cls+=" c-no"}
      h+=`<button class="${cls}" onclick="chkVMC(${i})"><span class="opt-ltr">${vAnswered&&i===vQ.ci?"✓":vAnswered&&i===vAns?"✗":String.fromCharCode(65+i)}</span><span>${o.t}</span></button>`;
    });
    h+=`</div>`;
    if(vAnswered)h+=`<div class="btn-row" style="margin-top:12px"><button class="btn-nx" onclick="genV()">Next →</button></div>`;
    h+=`</div>`;
  } else if(vQ.mode==="tf"){
    const ok=vAnswered&&vAns===vQ.correct;
    h+=`<div class="pc ${vAnswered?(ok?"ok":"no"):""}"><div class="pc-top"><span class="bg ${vAnswered?(ok?"bg-ok":"bg-no"):"bg-q"}">${vAnswered?(ok?"✓ Correct":"✗ Incorrect"):"Vocabulary"}</span><span class="bg bg-ty">True / False</span></div>`;
    h+=`<div class="q-txt">Is this definition of <b>"${vQ.term.t}"</b> correct?<br><br><em style="color:var(--mut)">"${vQ.shown}"</em></div>`;
    h+=`<div class="opts" style="flex-direction:row;gap:8px">`;
    ["True","False"].forEach((lab,i)=>{
      const val=i===0;
      let cls="opt";
      if(vAnswered){cls+=" done";if(val===vQ.correct)cls+=" c-ok";else if(val===vAns)cls+=" c-no"}
      h+=`<button class="${cls}" style="flex:1;justify-content:center" onclick="chkVTF(${val})">${lab}</button>`;
    });
    h+=`</div>`;
    if(vAnswered){
      h+=`<div class="sol" style="margin-top:14px"><div class="sol-tag">Correct definition</div><div class="stp">${vQ.term.d}</div></div>`;
      h+=`<div class="btn-row" style="margin-top:10px"><button class="btn-nx" onclick="genV()">Next →</button></div>`;
    }
    h+=`</div>`;
  } else {
    h+=`<div class="pc"><div class="pc-top"><span class="bg bg-q">Vocabulary</span><span class="bg bg-ty">Written Recall</span></div>`;
    h+=`<div class="q-txt">In your own words, define <b>"${vQ.term.t}"</b>.</div>`;
    if(!vAnswered){
      h+=`<textarea class="v-ta" id="vta" placeholder="Type your definition…">${vAns}</textarea>`;
      h+=`<div class="btn-row"><button class="ab" onclick="chkVW()">Reveal Answer</button></div>`;
    } else {
      h+=`<textarea class="v-ta" disabled>${vAns}</textarea>`;
      h+=`<div class="sol" style="margin-top:14px"><div class="sol-tag">Textbook definition</div><div class="stp">${vQ.term.d}</div><div class="sol-note">Compare your answer — did you capture the key idea?</div></div>`;
      h+=`<div class="btn-row" style="margin-top:10px"><button class="btn-nx" onclick="genV()">Next →</button></div>`;
    }
    h+=`</div>`;
  }
  el.innerHTML=h;
}

// LEARN MODE
// ============================================================
function renderLearn(){
  renderCtrls();
  if(!lessonKey){
    const el=document.getElementById("main");
    let h=`<div style="text-align:center;padding:20px 0 16px"><div style="font-size:36px;margin-bottom:8px">🎓</div><div style="font:400 24px/1.3 var(--s)">Choose a Lesson</div><div style="font:400 13px var(--f);color:var(--dim);margin-top:4px">Read through, hit the checkpoints, then take the quick quiz</div></div>`;
    h+=`<div class="topic-picker">`;
    Object.keys(LESSONS).forEach(k=>{
      h+=`<button class="topic-btn" onclick="openLesson('${k}')"><div style="font-size:20px">${LESSONS[k].icon}</div>${LESSONS[k].title}<div class="topic-sub">${LESSONS[k].cards.length} cards</div></button>`;
    });
    h+=`</div>`;
    el.innerHTML=h;
    return;
  }
  renderLessonCard();
}
function openLesson(k){lessonKey=k;lessonIdx=0;cpState={};quizState={};renderCtrls();renderLessonCard()}
function renderLessonCard(){
  const el=document.getElementById("main");
  const L=LESSONS[lessonKey],card=L.cards[lessonIdx];
  const total=L.cards.length;
  let h=`<div class="lesson-wrap">`;
  h+=`<div class="lesson-nav"><button class="nav-btn" onclick="lessonKey=null;renderLearn()">← All Lessons</button><div style="text-align:center"><div class="lesson-prog">${L.icon} ${L.title} · ${lessonIdx+1}/${total}</div><div class="prog-bar"><div class="prog-fill" style="width:${100*(lessonIdx+1)/total}%"></div></div></div><div style="width:90px"></div></div>`;
  h+=`<div class="lesson-card">`;
  if(card.type==="intro"){
    h+=`<div class="lesson-type">Introduction</div><div class="lesson-body">${card.body}</div>`;
  } else if(card.type==="def"){
    h+=`<div class="lesson-type">Key Concept</div><div class="lesson-def"><div class="lesson-def-t">${card.title}</div><div class="lesson-def-b">${card.body}</div></div>`;
  } else if(card.type==="eq"){
    h+=`<div class="lesson-type">Equation</div><div class="lesson-eq">${card.body}</div>`;
  } else if(card.type==="checkpoint"){
    const st=cpState[lessonIdx]||{};
    h+=`<div class="lesson-type">Checkpoint</div><div class="lesson-checkpoint"><div class="lesson-cp-t">✓ Try It Yourself</div><div class="lesson-cp-q">${card.q}</div>`;
    if(!st.done){
      h+=`<div class="aa"><div class="aw"><input class="ai" id="cpinp" type="text" inputmode="decimal" placeholder="${card.fields.placeholder}" value="${st.val||""}" onkeydown="if(event.key==='Enter')chkCP()"><span class="au">${card.fields.label}</span></div><button class="ab" onclick="chkCP()">Check</button></div>`;
      h+=`<div class="btn-row"><button class="btn-sh" onclick="showHint()">Show Hint</button></div>`;
      if(st.hint)h+=`<div class="hint-box">💡 ${card.hint}</div>`;
    } else {
      const ok=st.ok;
      h+=`<div class="aa"><div class="aw"><input class="ai ${ok?"v-ok":"v-no"}" value="${st.val}" disabled><span class="au">${card.fields.label}</span></div></div>`;
      h+=`<div class="fb ${ok?"fb-ok":"fb-no"}">${ok?"✓ Correct!":`✗ Answer: ${card.answer}`}</div>`;
      h+=`<div class="hint-box">💡 ${card.hint}</div>`;
    }
    h+=`</div>`;
  } else if(card.type==="quiz"){
    h+=renderQuizCard(card);
  }
  h+=`</div>`;
  // nav
  h+=`<div class="lesson-nav" style="margin-top:16px"><button class="nav-btn" onclick="prevCard()" ${lessonIdx===0?"disabled":""}>← Back</button>`;
  if(lessonIdx<total-1)h+=`<button class="nav-btn primary" onclick="nextCard()">Next →</button>`;
  else h+=`<button class="nav-btn primary" onclick="lessonKey=null;renderLearn()">Finish ✓</button>`;
  h+=`</div></div>`;
  el.innerHTML=h;
}
function chkCP(){
  const i=document.getElementById("cpinp");if(!i)return;
  const card=LESSONS[lessonKey].cards[lessonIdx];
  const val=i.value.trim();if(val==="")return;
  const v=parseFloat(val.replace(/[+,\s]/g,""));
  const ok=!isNaN(v)&&Math.abs(v-card.answer)<=card.tol;
  cpState[lessonIdx]={done:true,ok,val};
  renderLessonCard();
}
function showHint(){
  const st=cpState[lessonIdx]||{};
  const i=document.getElementById("cpinp");
  st.val=i?i.value:"";st.hint=true;
  cpState[lessonIdx]=st;
  renderLessonCard();
}
function renderQuizCard(card){
  const st=quizState[lessonIdx]||{idx:0,answers:[]};
  if(st.done){
    const score=st.answers.filter(Boolean).length;
    const pct=Math.round(100*score/card.questions.length);
    let h=`<div class="lesson-type">Quiz Complete</div><div style="text-align:center;padding:14px 0">`;
    h+=`<div class="quiz-score ${pct>=80?"qok":""}">${score}/${card.questions.length}</div>`;
    h+=`<div style="font:400 14px var(--f);color:var(--mut)">${pct}% — ${pct>=80?"Great work! 🎉":pct>=60?"Good effort — review the misses.":"Worth another read-through."}</div>`;
    h+=`<button class="nav-btn primary" style="margin-top:14px" onclick="quizState[lessonIdx]={idx:0,answers:[]};renderLessonCard()">Retake Quiz</button>`;
    h+=`</div>`;
    return h;
  }
  const q=card.questions[st.idx];
  let h=`<div class="lesson-type">Quiz · Question ${st.idx+1}/${card.questions.length}</div>`;
  h+=`<div class="lesson-cp-q" style="margin-bottom:14px">${q.q}</div><div class="opts">`;
  q.opts.forEach((o,i)=>{
    let cls="opt";
    if(st.picked!=null){cls+=" done";if(i===q.ci)cls+=" c-ok";else if(i===st.picked)cls+=" c-no"}
    h+=`<button class="${cls}" onclick="pickQuiz(${i})"><span class="opt-ltr">${st.picked!=null&&i===q.ci?"✓":st.picked!=null&&i===st.picked?"✗":String.fromCharCode(65+i)}</span><span>${o}</span></button>`;
  });
  h+=`</div>`;
  if(st.picked!=null){
    h+=`<div class="sol" style="margin-top:12px"><div class="sol-tag">Explanation</div><div class="stp">${q.exp}</div></div>`;
    h+=`<div class="btn-row" style="margin-top:10px"><button class="btn-nx" onclick="nextQuiz()">${st.idx<card.questions.length-1?"Next Question →":"See Results →"}</button></div>`;
  }
  return h;
}
function pickQuiz(i){
  const card=LESSONS[lessonKey].cards[lessonIdx];
  const st=quizState[lessonIdx]||{idx:0,answers:[]};
  if(st.picked!=null)return;
  st.picked=i;
  st.answers[st.idx]=(i===card.questions[st.idx].ci);
  quizState[lessonIdx]=st;
  renderLessonCard();
}
function nextQuiz(){
  const card=LESSONS[lessonKey].cards[lessonIdx];
  const st=quizState[lessonIdx];
  if(st.idx<card.questions.length-1){st.idx++;st.picked=null}
  else st.done=true;
  quizState[lessonIdx]=st;
  renderLessonCard();
}
function nextCard(){if(lessonIdx<LESSONS[lessonKey].cards.length-1){lessonIdx++;renderLessonCard()}}
function prevCard(){if(lessonIdx>0){lessonIdx--;renderLessonCard()}}

  const el=document.getElementById("main");

// ============================================================
// EXAM MODE
// ============================================================
const EXAM_LENGTH=50;

// Build 50 questions for a section, spreading across all generators evenly
function buildExamQuestions(sectionId){
  const pool=EXAM_POOLS[sectionId];
  const questions=[];
  // Round-robin through the generator pool (shuffled order each cycle) so all
  // template types appear, with no two identical types back to back.
  let lastGen=null;
  let cycle=shuffle(pool);
  let ci=0;
  for(let i=0;i<EXAM_LENGTH;i++){
    if(ci>=cycle.length){cycle=shuffle(pool);ci=0}
    let genId=cycle[ci++];
    // avoid immediate repeat
    if(genId===lastGen&&ci<cycle.length){const tmp=cycle[ci];cycle[ci]=genId;cycle[ci-1]=tmp;genId=cycle[ci-1]}
    lastGen=genId;
    const q=G[genId]();
    q._gen=genId;
    questions.push(q);
  }
  return questions;
}

function renderExam(){
  renderCtrls();
  const el=document.getElementById("main");
  // ---- RESULTS SCREEN ----
  if(examFinished){el.innerHTML=renderExamResults();return}
  // ---- LANDING SCREEN ----
  if(!examSection){
    let h=`<div class="exam-landing">`;
    h+=`<div class="exam-title">🎯 <i>Exam Mode</i></div>`;
    h+=`<div class="exam-sub">Pick a section for a full <b>${EXAM_LENGTH}-question</b> exam. Every question is freshly randomized — variables, scenarios, and units change every run, so it's practically infinite.</div>`;
    h+=`<div class="exam-section-grid">`;
    Object.keys(EXAM_META).forEach(sid=>{
      const m=EXAM_META[sid];
      const best=examBest[sid];
      h+=`<button class="exam-section-btn" onclick="examPick('${sid}')">`;
      h+=`<span class="exam-section-icon">${m.icon}</span>`;
      h+=`<div class="exam-section-name">${m.name}</div>`;
      h+=`<div class="exam-section-meta">${EXAM_POOLS[sid].length} question types · ${EXAM_LENGTH} Q exam</div>`;
      h+=`<div style="font:400 11px var(--f);color:var(--dim);margin-top:6px">${m.desc}</div>`;
      if(best!=null)h+=`<div class="exam-best">★ Best: ${best}/${EXAM_LENGTH}</div>`;
      h+=`</button>`;
    });
    h+=`</div>`;
    h+=`<div style="font:400 13px var(--f);color:var(--dim);margin-top:10px">Choose a section above to set up your exam.</div>`;
    h+=`</div>`;
    el.innerHTML=h;
    return;
  }
  // ---- SETUP SCREEN (section picked, not yet started) ----
  if(examQuestions.length===0){
    const m=EXAM_META[examSection];
    let h=`<div class="exam-landing">`;
    h+=`<div class="exam-title">${m.icon} <i>${m.name}</i></div>`;
    h+=`<div class="exam-sub">${EXAM_LENGTH} randomized questions drawn from ${EXAM_POOLS[examSection].length} different problem types. Set your options and begin.</div>`;
    h+=`<div class="exam-config">`;
    h+=`<div class="exam-config-card"><div class="exam-config-l">Questions</div><div class="exam-config-v">${EXAM_LENGTH}</div></div>`;
    h+=`<div class="exam-config-card"><div class="exam-config-l">Timer</div>`;
    h+=`<div class="exam-toggle"><button class="exam-tog-btn${!examTimerOn?" on":""}" onclick="examTimerOn=false;renderExam()">Off</button><button class="exam-tog-btn${examTimerOn?" on":""}" onclick="examTimerOn=true;renderExam()">On</button></div></div>`;
    if(examTimerOn){
      h+=`<div class="exam-config-card"><div class="exam-config-l">Time Limit</div>`;
      h+=`<div class="exam-toggle">`;
      [20,30,45,60].forEach(min=>{
        h+=`<button class="exam-tog-btn${examDurationMin===min?" on":""}" onclick="examDurationMin=${min};renderExam()">${min}m</button>`;
      });
      h+=`</div></div>`;
    }
    h+=`</div>`;
    h+=`<button class="exam-start-btn" onclick="startExam()">Start Exam →</button>`;
    h+=`<div style="margin-top:14px"><button class="btn-sh" onclick="examSection=null;renderExam()">← Pick a different section</button></div>`;
    h+=`</div>`;
    el.innerHTML=h;
    return;
  }
  // ---- QUESTION SCREEN ----
  el.innerHTML=renderExamQuestion();
  const inp=document.getElementById("exinp");
  if(inp&&examAnswers[examIdx]==null)setTimeout(()=>inp.focus(),50);
}

function examPick(sid){
  examSection=sid;
  examQuestions=[];examIdx=0;examAnswers=[];examInput="";examFinished=false;
  renderExam();
}

function startExam(){
  examQuestions=buildExamQuestions(examSection);
  examIdx=0;examAnswers=new Array(EXAM_LENGTH).fill(null);examInput="";
  examFinished=false;examElapsed=0;examStartTime=Date.now();
  if(examTimerId){clearInterval(examTimerId);examTimerId=null}
  if(examTimerOn){
    examTimerId=setInterval(()=>{
      examElapsed=Math.floor((Date.now()-examStartTime)/1000);
      const remain=examDurationMin*60-examElapsed;
      if(remain<=0){clearInterval(examTimerId);examTimerId=null;finishExam(true);return}
      const tEl=document.getElementById("examTimer");
      if(tEl){
        tEl.textContent="⏱ "+fmtTime(remain);
        tEl.className="exam-timer"+(remain<=60?" danger":remain<=300?" warn":"");
      }
    },1000);
  }
  renderExam();
}

function renderExamQuestion(){
  const p=examQuestions[examIdx];
  const ans=examAnswers[examIdx];
  const answered=ans!=null;
  const correctCount=examAnswers.filter(a=>a&&a.ok).length;
  const attempted=examAnswers.filter(a=>a!=null).length;
  let h="";
  // exam bar
  h+=`<div class="exam-bar">`;
  h+=`<div class="exam-q-counter">Q <span>${examIdx+1}</span> / ${EXAM_LENGTH}</div>`;
  h+=`<div class="exam-progress-bar"><div class="exam-progress-fill" style="width:${100*attempted/EXAM_LENGTH}%"></div></div>`;
  if(examTimerOn){
    const remain=examDurationMin*60-examElapsed;
    h+=`<div class="exam-timer${remain<=60?" danger":remain<=300?" warn":""}" id="examTimer">⏱ ${fmtTime(Math.max(0,remain))}</div>`;
  } else {
    h+=`<div class="exam-mini-stats"><span class="ok">${correctCount} ✓</span><span>${attempted} done</span></div>`;
  }
  h+=`<button class="exam-quit" onclick="quitExam()">Quit</button>`;
  h+=`</div>`;
  // question card
  const ok=answered&&ans.ok;
  const cc=answered?(ok?"ok":"no"):"";
  h+=`<div class="pc ${cc}"><div class="pc-top">`;
  h+=`<span class="bg ${answered?(ok?"bg-ok":"bg-no"):"bg-q"}">${answered?(ok?"✓ Correct":"✗ Incorrect"):"Question "+(examIdx+1)}</span>`;
  h+=`<span class="bg bg-ty">${p.ref}</span>`;
  h+=`<span class="bg bg-ty">${EXAM_META[examSection].icon} ${EXAM_META[examSection].name}</span>`;
  h+=`</div>`;
  h+=`<div class="q-txt">${p.q}</div>`;
  // givens/formula always shown in exam (it's a real exam, but givens help focus)
  if(p.gv){
    h+=`<div class="ir">`;
    h+=`<div class="ib ib-g"><span class="ib-l">Given</span>${p.gv.replace(/\n/g,"<br>")}</div>`;
    if(p.fm)h+=`<div class="ib ib-f"><span class="ib-l">Formula</span>${p.fm.replace(/\n/g,"<br>")}</div>`;
    if(p.fi)h+=`<div class="ib ib-w"><span class="ib-l">Solve For</span>${p.fi.replace(/\n/g,"<br>")}</div>`;
    h+=`</div>`;
  }
  if(!answered){
    h+=`<div class="aa"><div class="aw"><input class="ai" id="exinp" type="text" inputmode="${p.isText?"text":"decimal"}" placeholder="Your answer…" value="${examInput}" onkeydown="if(event.key==='Enter')submitExamAnswer()"><span class="au">${p.u||""}</span></div><button class="ab" onclick="submitExamAnswer()">Submit</button></div>`;
  } else {
    h+=`<div class="aa"><div class="aw"><input class="ai ${ok?"v-ok":"v-no"}" value="${ans.val}" disabled><span class="au">${p.u||""}</span></div></div>`;
    h+=`<div class="fb ${ok?"fb-ok":"fb-no"}">${ok?"✓ Correct":`✗ Correct answer: ${p.a} ${p.u||""}`}</div>`;
    h+=`<div class="sol"><div class="sol-tag">Solution</div>`;
    p.st.forEach(s=>{h+=`<div class="stp">${s}</div>`});
    h+=`<div class="sol-note">${p.nt}</div></div>`;
  }
  h+=`</div>`;
  // nav
  h+=`<div class="lesson-nav">`;
  h+=`<button class="nav-btn" onclick="examPrev()" ${examIdx===0?"disabled":""}>← Previous</button>`;
  if(answered){
    if(examIdx<EXAM_LENGTH-1)h+=`<button class="nav-btn primary" onclick="examNext()">Next Question →</button>`;
    else h+=`<button class="nav-btn primary" onclick="finishExam(false)">Finish Exam ✓</button>`;
  } else {
    h+=`<div style="font:400 11px var(--f);color:var(--dim);align-self:center">Submit an answer to continue</div>`;
  }
  h+=`</div>`;
  return h;
}

function submitExamAnswer(){
  const inp=document.getElementById("exinp");if(!inp)return;
  const val=inp.value.trim();if(val==="")return;
  const p=examQuestions[examIdx];
  const ok=isCorrect(p,val);
  examAnswers[examIdx]={val,ok};
  examInput="";
  recordAnswer(ok);
  renderExam();
}
function examNext(){
  if(examIdx<EXAM_LENGTH-1){examIdx++;examInput="";renderExam()}
}
function examPrev(){
  if(examIdx>0){examIdx--;examInput="";renderExam()}
}
function quitExam(){
  if(confirm("Quit this exam? Your progress will be lost.")){
    if(examTimerId){clearInterval(examTimerId);examTimerId=null}
    examSection=null;examQuestions=[];examFinished=false;
    renderExam();
  }
}
function finishExam(timeUp){
  if(examTimerId){clearInterval(examTimerId);examTimerId=null}
  // auto-mark any unanswered as incorrect
  for(let i=0;i<EXAM_LENGTH;i++){
    if(examAnswers[i]==null)examAnswers[i]={val:"—",ok:false,skipped:true};
  }
  const score=examAnswers.filter(a=>a.ok).length;
  if(examBest[examSection]==null||score>examBest[examSection]){
    examBest[examSection]=score;
    localStorage.setItem("m2_exam_best",JSON.stringify(examBest));
  }
  examFinished=true;examTimeUp=timeUp;examReviewIdx=-1;
  renderExam();
}
let examTimeUp=false;

function renderExamResults(){
  const score=examAnswers.filter(a=>a.ok).length;
  const pct=Math.round(100*score/EXAM_LENGTH);
  const grade=pct>=90?"A":pct>=80?"B":pct>=70?"C":pct>=60?"D":"F";
  const colorClass=pct>=90?"gold":pct>=75?"green":pct>=60?"orange":"red";
  const m=EXAM_META[examSection];
  let h=`<div class="exam-results">`;
  h+=`<div style="font:400 22px var(--s);color:var(--mut)">${m.icon} ${m.name} Exam</div>`;
  if(examTimeUp)h+=`<div style="font:600 12px var(--m);color:var(--red);margin-top:6px">⏱ Time expired — unanswered questions marked incorrect</div>`;
  h+=`<div class="exam-results-score ${colorClass}">${score}<span style="font-size:28px;color:var(--dim)">/${EXAM_LENGTH}</span></div>`;
  h+=`<div class="exam-results-pct">${pct}%</div>`;
  h+=`<div class="exam-results-grade ${colorClass==="gold"||colorClass==="green"?"":""}" style="color:${pct>=90?"var(--ylw)":pct>=75?"var(--grn)":pct>=60?"var(--org)":"var(--red)"}">Grade: ${grade}</div>`;
  // encouragement
  const msg=pct>=90?"Outstanding! You've mastered this section. 🎉":pct>=80?"Great work — you really know this material!":pct>=70?"Solid pass. Review the misses below to level up.":pct>=60?"You passed, but there's room to grow. Study the solutions.":"Keep going — review the solutions and try again. You've got this! 💪";
  h+=`<div style="font:400 14px var(--f);color:var(--mut);max-width:440px;margin:0 auto 10px">${msg}</div>`;
  // meta cards
  h+=`<div class="exam-results-meta">`;
  h+=`<div class="exam-meta-card"><div class="exam-meta-l">Correct</div><div class="exam-meta-v" style="color:var(--grn)">${score}</div></div>`;
  h+=`<div class="exam-meta-card"><div class="exam-meta-l">Incorrect</div><div class="exam-meta-v" style="color:var(--red)">${EXAM_LENGTH-score}</div></div>`;
  if(examTimerOn)h+=`<div class="exam-meta-card"><div class="exam-meta-l">Time Used</div><div class="exam-meta-v">${fmtTime(examElapsed)}</div></div>`;
  h+=`<div class="exam-meta-card"><div class="exam-meta-l">Best Ever</div><div class="exam-meta-v" style="color:var(--ylw)">${examBest[examSection]}</div></div>`;
  h+=`</div>`;
  // action buttons
  h+=`<div class="btn-row" style="justify-content:center;margin:16px 0">`;
  h+=`<button class="exam-start-btn" onclick="examPick('${examSection}')">Retake This Exam</button>`;
  h+=`<button class="nav-btn" onclick="examSection=null;examQuestions=[];examFinished=false;renderExam()">Different Section</button>`;
  h+=`</div>`;
  // review list
  h+=`<div class="exam-review-list"><div style="font:700 11px var(--m);letter-spacing:.1em;color:var(--acc);text-transform:uppercase;margin-bottom:10px">Question Review — tap any to expand</div>`;
  examQuestions.forEach((p,i)=>{
    const a=examAnswers[i];
    const expanded=examReviewIdx===i;
    // strip HTML graphs from the review snippet
    const snippet=p.q.replace(/<svg[\s\S]*?<\/svg>/g,"[graph]").replace(/<[^>]+>/g,"").slice(0,90);
    h+=`<div class="exam-review-item ${a.ok?"ok-row":"no-row"}" onclick="toggleReview(${i})">`;
    h+=`<div class="exam-review-num">${i+1}</div>`;
    h+=`<div class="exam-review-q">${snippet}${snippet.length>=90?"…":""}`;
    if(expanded){
      h+=`<div style="margin-top:8px;padding:10px;background:rgba(0,0,0,0.2);border-radius:8px">`;
      h+=`<div style="font:400 13px/1.7 var(--s);color:var(--txt);margin-bottom:8px">${p.q}</div>`;
      h+=`<div style="font:500 11px var(--m);color:${a.ok?"var(--grn)":"var(--red)"}">Your answer: ${a.val} ${a.skipped?"(skipped)":""} ${p.u||""}</div>`;
      if(!a.ok)h+=`<div style="font:500 11px var(--m);color:var(--grn)">Correct: ${p.a} ${p.u||""}</div>`;
      h+=`<div class="sol" style="margin-top:8px">`;
      p.st.forEach(s=>{h+=`<div class="stp">${s}</div>`});
      h+=`<div class="sol-note">${p.nt}</div></div>`;
      h+=`</div>`;
    }
    h+=`</div>`;
    h+=`<div class="exam-review-status ${a.ok?"ok":"no"}">${a.ok?"✓":"✗"}</div>`;
    h+=`</div>`;
  });
  h+=`</div></div>`;
  return h;
}
function toggleReview(i){
  examReviewIdx=examReviewIdx===i?-1:i;
  renderExam();
}

genP();
